version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - secure_net

  web:
    build: ./web
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - db
    networks:
      - secure_net

volumes:
  db-data:

networks:
  secure_net:
    driver: bridge
